<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flex Node Panel</title><style>body{font-family:Arial;background:#080b13;color:#eef;margin:0}.wrap{max-width:1000px;margin:auto;padding:30px}.box{background:#101522;border:1px solid #242c40;border-radius:16px;padding:20px;margin:16px 0}input,button{padding:12px;border-radius:9px;border:1px solid #303a55;background:#0a0e18;color:#fff;margin:5px}button{background:#7180ff;border:0;font-weight:bold;cursor:pointer}.server{padding:16px;border:1px solid #252e44;border-radius:12px;margin:10px 0}.muted{color:#8e9ab5}</style></head><body><div class="wrap"><h1>Flex Node</h1><div class="box"><h2>Регистрация</h2><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Пароль"><button onclick="reg()">Зарегистрироваться</button><button onclick="login()">Войти</button><button onclick="logout()">Выйти</button><p id="msg"></p></div><div class="box"><h2>Создать сервер</h2><input id="name" placeholder="Название"><input id="slots" type="number" value="100" placeholder="Слоты"><input id="port" type="number" value="7777" placeholder="Порт"><input id="ram" type="number" value="512" placeholder="RAM MB"><input id="cpu" type="number" step="0.1" value="0.5" placeholder="CPU cores"><button onclick="create()">Создать</button></div><div class="box"><h2>Мои серверы</h2><div id="servers">Загрузка...</div></div></div><script>
const $=id=>document.getElementById(id); async function api(url,opt={}){let r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json'},...opt});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Ошибка');return j}
async function reg(){try{await api('/api/auth/register',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('pass').value})});$('msg').textContent='Аккаунт создан'}catch(e){$('msg').textContent=e.message}}
async function login(){try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('pass').value})});$('msg').textContent='Выполнен вход';load()}catch(e){$('msg').textContent=e.message}}
async function logout(){await api('/api/auth/logout',{method:'POST'});load()}
async function create(){try{await api('/api/servers',{method:'POST',body:JSON.stringify({name:$('name').value,slots:+$('slots').value,port:+$('port').value,memoryMb:+$('ram').value,cpuCores:+$('cpu').value})});load()}catch(e){alert(e.message)}}
async function action(id,a){try{await api('/api/servers/'+id+'/'+a,{method:'POST'});load()}catch(e){alert(e.message)}}
async function load(){try{let s=await api('/api/servers');$('servers').innerHTML=s.map(x=>`<div class="server"><b>${x.name}</b><div class="muted">${x.game.toUpperCase()} • ${x.port} • ${x.slots} slots • ${x.memoryMb} MB • ${x.cpuCores} CPU • ${x.status}</div><button onclick="action('${x.id}','start')">Запустить</button><button onclick="action('${x.id}','restart')">Перезапустить</button><button onclick="action('${x.id}','stop')">Остановить</button><button onclick="location='/files.html?id=${x.id}'">Файлы</button></div>`).join('')||'Серверов пока нет'}catch(e){$('servers').textContent='Войдите, чтобы увидеть серверы'}}
load();
</script></body></html>
