<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flex Node Files</title><style>body{font-family:Arial;background:#080b13;color:#eef;margin:0}.wrap{max-width:1100px;margin:auto;padding:30px}.box{background:#101522;border:1px solid #242c40;border-radius:16px;padding:20px;margin:16px 0}textarea{width:100%;height:420px;background:#070a10;color:#dfe7ff;border:1px solid #2a3450;border-radius:10px;padding:12px;box-sizing:border-box}button{padding:11px 15px;border:0;border-radius:8px;background:#7180ff;color:white;font-weight:bold;cursor:pointer}.item{padding:10px;border-bottom:1px solid #20283b;cursor:pointer}.muted{color:#8e9ab5}</style></head><body><div class="wrap"><h1>Файловый менеджер</h1><div class="box"><div id="list"></div></div><div class="box"><input id="path" placeholder="server.cfg"><button onclick="openFile()">Открыть</button><button onclick="save()">Сохранить</button><textarea id="editor"></textarea></div></div><script>
const id=new URLSearchParams(location.search).get('id');let current='';async function api(u,o={}){let r=await fetch(u,{credentials:'include',headers:{'Content-Type':'application/json'},...o});let j=await r.json();if(!r.ok)throw Error(j.error);return j}
async function list(){let x=await api('/api/servers/'+id+'/files');document.getElementById('list').innerHTML=x.map(i=>`<div class=item onclick="${i.type==='file'?`openNamed('${i.name}')`:''}">${i.type==='dir'?'📁':'📄'} ${i.name} <span class=muted>${i.size}</span></div>`).join('')}
async function openNamed(p){document.getElementById('path').value=p;openFile()}async function openFile(){current=document.getElementById('path').value;let x=await api('/api/servers/'+id+'/file?path='+encodeURIComponent(current));document.getElementById('editor').value=x.content}async function save(){await api('/api/servers/'+id+'/file',{method:'PUT',body:JSON.stringify({path:document.getElementById('path').value,content:document.getElementById('editor').value})});alert('Сохранено')}list();
</script></body></html>
